name: Update South Florida events

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q

      - name: Update event JSON
        run: python -m scripts.update_events

      - name: Validate generated JSON
        run: python -m scripts.validate_events broward-events.json miami-events.json

      - name: Commit changes
        run: |
          git config user.name "south-florida-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add broward-events.json miami-events.json
          if git diff --cached --quiet; then
            echo "No event changes today."
          else
            git commit -m "Daily event update"
            git push
          fi
